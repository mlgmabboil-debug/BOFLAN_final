<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BOFLAN</title>
    <script id="sandbox-fetch-fix">
      (function() {
        try {
          if (typeof window !== 'undefined') {
            var originalFetch = window.fetch;
            var currentFetch = originalFetch;
            Object.defineProperty(window, 'fetch', {
              get: function() {
                return (typeof currentFetch === 'function') ? currentFetch.bind(window) : currentFetch;
              },
              set: function(value) {
                currentFetch = value;
              },
              configurable: true,
              enumerable: true
            });
          }
        } catch (e) {
          console.warn('Sandbox fetch setter fallback failed:', e);
        }
      })();
    </script>
    <script id="websocket-error-silencer">
      (function() {
        if (typeof window !== 'undefined') {
          window.addEventListener('unhandledrejection', function(event) {
            var reason = event.reason;
            if (reason) {
              var reasonStr = (typeof reason === 'string') ? reason : (reason.message || '');
              if (reasonStr.indexOf('WebSocket') !== -1 || reasonStr.indexOf('websocket') !== -1) {
                console.warn('Silenced benign sandboxed WebSocket unhandled rejection:', reason);
                event.preventDefault();
                event.stopPropagation();
              }
            }
          }, { capture: true });

          window.addEventListener('error', function(event) {
            var message = event.message || '';
            if (message.indexOf('WebSocket') !== -1 || message.indexOf('websocket') !== -1) {
              console.warn('Silenced benign sandboxed WebSocket error:', message);
              event.preventDefault();
              event.stopPropagation();
            }
          }, { capture: true });
        }
      })();
    </script>
  </head>
  <body>
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for(let registration of registrations) {
            registration.unregister()
          }
        })
      }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
