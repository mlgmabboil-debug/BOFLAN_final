<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BOFLAN</title>
    <script id="sandbox-fetch-fix">
      (function() {
        try {
          if (typeof window !== 'undefined') {
            var originalFetch = window.fetch;
            var currentFetch = originalFetch;
            Object.defineProperty(window, 'fetch', {
              get: function() {
                return (typeof currentFetch === 'function') ? currentFetch.bind(window) : currentFetch;
              },
              set: function(value) {
                currentFetch = value;
              },
              configurable: true,
              enumerable: true
            });
          }
        } catch (e) {
          console.warn('Sandbox fetch setter fallback failed:', e);
        }
      })();
    </script>
    <script id="websocket-error-silencer">
      (function() {
        if (typeof window !== 'undefined') {
          var OriginalWebSocket = window.WebSocket;
          
          function MockWebSocket(url, protocols) {
            this.url = url;
            this.protocols = protocols;
            this.readyState = 0; // CONNECTING
            this.listeners = {};
            
            this.onopen = null;
            this.onclose = null;
            this.onerror = null;
            this.onmessage = null;

            this._trigger = function(eventStr, eventObj) {
              var listeners = this.listeners[eventStr] || [];
              for (var i = 0; i < listeners.length; i++) {
                try { listeners[i].call(this, eventObj); } catch(e) {}
              }
              var onHandler = this['on' + eventStr];
              if (typeof onHandler === 'function') {
                try { onHandler.call(this, eventObj); } catch(e) {}
              }
            };

            var self = this;
            setTimeout(function() {
              self.readyState = 1; // OPEN
              self._trigger('open', { type: 'open' });
            }, 50);
          }

          MockWebSocket.prototype.addEventListener = function(event, callback) {
            if (!this.listeners[event]) {
              this.listeners[event] = [];
            }
            this.listeners[event].push(callback);
          };

          MockWebSocket.prototype.removeEventListener = function(event, callback) {
            if (this.listeners[event]) {
              this.listeners[event] = this.listeners[event].filter(function(cb) { return cb !== callback; });
            }
          };

          MockWebSocket.prototype.send = function(data) {
            // No-op
          };

          MockWebSocket.prototype.close = function() {
            this.readyState = 3; // CLOSED
            this._trigger('close', { type: 'close', wasClean: true, code: 1000, reason: '' });
          };

          [MockWebSocket, MockWebSocket.prototype].forEach(function(obj) {
            Object.defineProperties(obj, {
              CONNECTING: { value: 0, enumerable: true },
              OPEN: { value: 1, enumerable: true },
              CLOSING: { value: 2, enumerable: true },
              CLOSED: { value: 3, enumerable: true }
            });
          });

          // Check and stub WebSocket calls intended for HMR / dev server
          window.WebSocket = function(url, protocols) {
            var urlStr = String(url || '');
            if (urlStr.indexOf('vite-hmr') !== -1 || urlStr.indexOf('hmr') !== -1 || urlStr.indexOf('localhost') !== -1 || urlStr.indexOf(':3000') !== -1) {
              return new MockWebSocket(url, protocols);
            }
            if (OriginalWebSocket) {
              return new OriginalWebSocket(url, protocols);
            }
            return new MockWebSocket(url, protocols);
          };
          window.WebSocket.prototype = MockWebSocket.prototype;
          if (OriginalWebSocket) {
            Object.assign(window.WebSocket, OriginalWebSocket);
          }

          // Unhandled rejections and standard errors listener backup
          window.addEventListener('unhandledrejection', function(event) {
            var reason = event.reason;
            if (reason) {
              var reasonStr = (typeof reason === 'string') ? reason : (reason.message || '');
              if (reasonStr.indexOf('WebSocket') !== -1 || reasonStr.indexOf('websocket') !== -1) {
                event.preventDefault();
                event.stopPropagation();
              }
            }
          }, { capture: true });

          window.addEventListener('error', function(event) {
            var message = event.message || '';
            if (message.indexOf('WebSocket') !== -1 || message.indexOf('websocket') !== -1) {
              event.preventDefault();
              event.stopPropagation();
            }
          }, { capture: true });

          // Console filtering for known benign messages
          var originalConsoleError = console.error;
          console.error = function() {
            var msg = arguments[0];
            if (typeof msg === 'string' && (msg.indexOf('failed to connect to websocket') !== -1 || msg.indexOf('WebSocket closed without opened') !== -1)) {
              return;
            }
            originalConsoleError.apply(console, arguments);
          };

          var originalConsoleWarn = console.warn;
          console.warn = function() {
            var msg = arguments[0];
            if (typeof msg === 'string' && (msg.indexOf('Lit is in dev mode') !== -1 || msg.indexOf('externalized for browser compatibility') !== -1 || msg.indexOf('WebSocket') !== -1)) {
              return;
            }
            originalConsoleWarn.apply(console, arguments);
          };
        }
      })();
    </script>
  </head>
  <body>
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for(let registration of registrations) {
            registration.unregister()
          }
        })
      }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
